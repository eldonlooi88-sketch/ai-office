<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efebe5">
<meta name="referrer" content="no-referrer">
<title>AI 团队办公室</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>
<div id="scene"></div>
<header id="topbar">
  <div class="brand"><span class="logo">◆</span><span id="title">AI 团队办公室</span></div>
  <div id="btc" class="btc" title="BTC/USD">BTC <b id="btcPrice">--</b> <span id="btcChg"></span></div>
  <div class="actions">
    <button id="btnDayNight" type="button" title="昼夜切换">🌓 自动</button>
    <button id="btnDemo" type="button" title="演示模式：本地随机切换状态，不写入服务器">▶ 演示</button>
    <button id="btnPanel" type="button" title="团队面板">☰ 团队</button>
  </div>
</header>
<div id="demoBanner" hidden>演示模式中 · 状态为本地随机模拟，不影响真实数据</div>
<aside id="panel">
  <div class="panel-head">
    <h2>团队状态</h2>
    <span id="summary"></span>
  </div>
  <ul id="botList"></ul>
  <div class="legend" id="legend"></div>
  <div class="panel-foot"><span id="conn">连接中…</span> · <span id="updated"></span></div>
</aside>
<aside id="chat" hidden aria-label="对话">
  <div class="chat-head">
    <span class="dot" id="chatDot"></span>
    <div class="chat-who"><b id="chatName"></b><span id="chatRole" class="brole"></span><div id="chatStatus" class="chat-status"></div></div>
    <button id="chatLogout" type="button" class="ghost" title="在本设备退出老板登录" hidden>退出</button>
    <button id="chatClose" type="button" class="ghost icon" title="关闭" aria-label="关闭">✕</button>
  </div>
  <div id="chatLogin" class="chat-login" hidden>
    <div class="lock">🔒</div>
    <p>对话仅限老板使用，请输入老板口令。<br><small>口令只保存在这台设备上，可随时“退出”。</small></p>
    <input id="chatPass" type="password" autocomplete="current-password" placeholder="老板口令" maxlength="200" spellcheck="false" autocapitalize="off">
    <button id="chatLoginBtn" type="button" class="primary">进入对话</button>
    <div id="chatLoginErr" class="err" role="alert"></div>
  </div>
  <div id="chatMain" class="chat-main" hidden>
    <div class="chat-hint">💡 回复不是即时的：员工会定时查看留言，通常几分钟内回复。</div>
    <ol id="chatList" class="chat-list" aria-live="polite"></ol>
    <div class="chat-input">
      <textarea id="chatText" rows="1" maxlength="500" placeholder="给 TA 留言或派任务…"></textarea>
      <button id="chatSend" type="button" class="primary">发送</button>
    </div>
    <div class="chat-foot"><span id="chatCount">0/500</span><span id="chatPoll"></span></div>
  </div>
</aside>
<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
